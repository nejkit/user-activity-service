services:
  storage:
    image: postgres:latest

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: activityservice


    ports:
      - "5432:5432"

  react:
    image: react-client-demo:latest
    ports:
      - "80:3000"

  service:
    image: activity-service:latest
    ports:
      - "1025:8080"

    depends_on:
      - storage

    env_file:
      - .env.example